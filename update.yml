name: Update BTC Dashboard

on:
  schedule:
    # Runs daily at 13:00 UTC. Adjust as you like (cron syntax).
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

# Prevents two runs (e.g. a scheduled one and a manual one) from executing
# at the same time and racing to push — this was the cause of the
# "[rejected] master -> master (fetch first)" error. Any run that starts
# while another is still going now waits in queue instead of colliding.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        env:
          BGEOMETRICS_API_KEY: ${{ secrets.BGEOMETRICS_API_KEY }}
        run: python update_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "btc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git diff --quiet --cached || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%d)"
          # Retry loop: if a manual commit (e.g. uploading files via the
          # GitHub web UI) landed on master at the same moment, pull it in
          # and retry rather than failing outright. -X ours tells git to
          # keep our version if the exact same lines conflict — safe here
          # because dashboard.html is fully machine-regenerated each run,
          # so the newest computed version is always correct, never a
          # human edit worth preserving over ours.
          for i in 1 2 3 4 5; do
            if git diff --quiet --cached 2>/dev/null; then
              # nothing new to push (dashboard.html didn't actually change)
              break
            fi
            git pull --rebase -X ours origin master && git push && break
            echo "Push attempt $i failed, retrying in a few seconds..."
            sleep $((RANDOM % 8 + 4))
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
