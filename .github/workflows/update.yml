name: Update BTC Dashboard

on:
  schedule:
    # Runs daily at 13:00 UTC. Adjust as you like (cron syntax).
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        env:
          BGEOMETRICS_API_KEY: ${{ secrets.BGEOMETRICS_API_KEY }}
        run: python update_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "btc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git diff --quiet --cached || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
