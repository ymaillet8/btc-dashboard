name: Debug supply-in-profit endpoint

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Curl api.bitcoin-data.com (the host update_dashboard.py actually uses)
        env:
          BGEOMETRICS_API_KEY: ${{ secrets.BGEOMETRICS_API_KEY }}
        run: |
          echo "=== https://api.bitcoin-data.com/v1/supply-in-profit ==="
          curl -sS -D - -o body1.txt -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $BGEOMETRICS_API_KEY" \
            "https://api.bitcoin-data.com/v1/supply-in-profit"
          echo "--- body ---"
          cat body1.txt

      - name: Curl api.bgeometrics.com (the host as literally requested)
        env:
          BGEOMETRICS_API_KEY: ${{ secrets.BGEOMETRICS_API_KEY }}
        run: |
          echo "=== https://api.bgeometrics.com/v1/supply-in-profit ==="
          curl -sS -D - -o body2.txt -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $BGEOMETRICS_API_KEY" \
            "https://api.bgeometrics.com/v1/supply-in-profit"
          echo "--- body ---"
          cat body2.txt
